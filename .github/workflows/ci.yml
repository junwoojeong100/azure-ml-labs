name: Lab code quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install the validated dependencies
        run: python -m pip install -r requirements-lock.txt && python -m pip install --no-deps -e .
      - name: Validate data, pipeline graph, quality gate, and portable components
        run: python -m pytest
