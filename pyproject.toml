[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-ml-mlops-lab"
version = "0.1.0"
description = "Studio-first Azure Machine Learning MLOps hands-on lab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-ai-ml>=1.30,<2",
    "azure-identity>=1.25,<2",
    "azure-storage-file-share>=12.26,<13",
    "azureml-mlflow>=1.60,<2",
    "mlflow>=2.22,<3",
    "numpy>=1.26,<2",
    "pandas>=2.2,<2.3",
    "scikit-learn>=1.5,<1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "nbformat>=5.10,<6", "ipykernel>=6.29,<7"]

[tool.setuptools.packages.find]
include = ["mlops_lab*", "components*"]

[tool.setuptools.package-data]
components = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
